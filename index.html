  --plum:#1c0f26;      /* stage curtain */
  --velvet:#2d1438;    /* curtain fold */
  --gold:#e3b858;      /* logo gold */
  --gold-deep:#a8792b;
  --cream:#fbf1dc;     /* bulb glow / text */
  --mute:#c9b6cf;
  --ink:#1a0d12;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100vh;color:var(--cream);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background-color:var(--plum);
  background-image:
    radial-gradient(ellipse 70% 45% at 50% 0%, rgba(227,184,88,.28), transparent 70%),
    radial-gradient(ellipse 60% 40% at 0% 75%, rgba(214,41,118,.16), transparent 70%),
    radial-gradient(ellipse 60% 40% at 100% 90%, rgba(79,91,213,.18), transparent 70%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 2px, transparent 2px 38px, rgba(255,255,255,.035) 38px 40px, transparent 40px 76px),
    linear-gradient(180deg,var(--velvet),var(--plum) 60%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}

.wrap{max-width:460px;margin:0 auto;padding:28px 18px 40px}

/* ---------- Marquee hero ---------- */
.marquee{
  position:relative;margin:8px auto 18px;width:min(100%,360px);aspect-ratio:1/1;
  border-radius:28px;
  background:radial-gradient(circle at 50% 42%, rgba(255,236,190,.16), rgba(28,15,38,.0) 62%), rgba(0,0,0,.25);
  border:3px solid var(--gold-deep);
  box-shadow:0 0 0 6px rgba(227,184,88,.08), 0 30px 60px -20px rgba(0,0,0,.7), inset 0 0 40px rgba(0,0,0,.5);
}
.marquee img{position:absolute;inset:9%;width:82%;height:82%;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
.bulb{
  position:absolute;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;
  background:#6b5130;box-shadow:inset 0 -2px 3px rgba(0,0,0,.4);
}
.bulb.on{background:radial-gradient(circle at 40% 35%,#fff,var(--cream) 35%,var(--gold) 80%);box-shadow:0 0 8px 2px rgba(255,214,130,.85),0 0 18px 4px rgba(227,184,88,.35)}

.tag{
  font-family:"Limelight",Georgia,serif;font-size:clamp(1.55rem,6.4vw,1.95rem);line-height:1.15;
  text-align:center;margin:0 0 6px;color:var(--gold);
  text-shadow:0 0 18px rgba(227,184,88,.35),0 2px 0 #5a3d14;
}
.sub{text-align:center;color:var(--mute);margin:0 auto 26px;max-width:32ch}

/* ---------- Ticket buttons ---------- */
.links{display:grid;gap:12px;margin:0 0 34px;padding:0;list-style:none}
.ticket{
  --notch:11px;
  position:relative;display:flex;align-items:center;gap:14px;
  min-height:62px;padding:12px 18px 12px 16px;text-decoration:none;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  border:1.5px solid rgba(227,184,88,.55);border-radius:12px;
  -webkit-mask:radial-gradient(circle var(--notch) at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,
               radial-gradient(circle var(--notch) at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle var(--notch) at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,
               radial-gradient(circle var(--notch) at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat;
  transition:background .2s,transform .15s;
}
.ticket:hover{background:linear-gradient(180deg,rgba(227,184,88,.2),rgba(227,184,88,.06))}
.ticket:active{transform:scale(.985)}
.ticket svg{flex:none;width:26px;height:26px;margin-left:8px;color:var(--gold)}
.ticket .t{display:flex;flex-direction:column;line-height:1.25}
.ticket b{font-weight:650;font-size:1.04rem}
.ticket small{color:var(--mute);font-size:.84rem}
.ticket.main{background:linear-gradient(180deg,#f2cf7c,var(--gold) 55%,#c4923c);color:var(--ink);border-color:#f7dc96;box-shadow:0 8px 28px -10px rgba(227,184,88,.6)}
.ticket.main svg,.ticket.main small{color:#3d2810}
.ticket.community{background:linear-gradient(180deg,#3ee07d,#25d366 55%,#139c4b);color:#062d17;border-color:#8ff0b4;box-shadow:0 8px 28px -10px rgba(37,211,102,.65);min-height:70px}
.ticket.community svg,.ticket.community small{color:#063d1e}
.ticket.community b{font-size:1.1rem}
.ticket.community:hover{background:linear-gradient(180deg,#5ae891,#30db71 55%,#18a956)}
/* Instagram official gradient */
.ticket.ig{background:linear-gradient(100deg,#f58529 0%,#dd2a7b 40%,#8134af 75%,#515bd4 100%);color:#fff;border-color:rgba(255,255,255,.35);box-shadow:0 8px 26px -12px rgba(214,41,118,.75)}
.ticket.ig svg,.ticket.ig small{color:#fff}
.ticket.ig small{opacity:.92}
.ticket.ig .t,.ticket.ig svg{text-shadow:0 1px 2px rgba(0,0,0,.25)}
.ticket.ig:hover{filter:brightness(1.08)}
/* Facebook official blue */
.ticket.fb{background:linear-gradient(180deg,#3b8cf7,#1877f2 55%,#0f5fcc);color:#fff;border-color:rgba(255,255,255,.3);box-shadow:0 8px 26px -12px rgba(24,119,242,.75)}
.ticket.fb svg,.ticket.fb small{color:#fff}
.ticket.fb small{opacity:.92}
.ticket.fb:hover{filter:brightness(1.08)}
.ticket.main:hover{background:linear-gradient(180deg,#f7da92,#e9c068 55%,#cf9c45)}

/* ---------- Sections ---------- */
h2{font-family:"Limelight",Georgia,serif;font-weight:400;font-size:1.45rem;color:var(--gold);margin:0 0 14px;text-align:center}
.sec{margin:0 0 34px}

.dates{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.date{display:grid;grid-template-columns:62px 1fr;gap:14px;align-items:center;padding:10px 14px 10px 10px;background:rgba(0,0,0,.22);border-radius:14px}
.cal{text-align:center;border-radius:10px;background:var(--cream);color:var(--ink);padding:6px 0 4px;line-height:1}
.cal span{display:block;font-size:.72rem;background:#8e1f3a;color:#fff;margin:-6px 0 4px;padding:4px 0;border-radius:10px 10px 0 0}
.cal strong{font-size:1.5rem}
.date b{display:block}
.date small{color:var(--mute)}

.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 30px}
.tool{
  font:inherit;font-weight:600;font-size:.95rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;
  color:var(--cream);background:transparent;border:1.5px solid rgba(251,241,220,.3);border-radius:999px;
}
.tool:hover{border-color:var(--gold);color:var(--gold)}
.tool svg{width:18px;height:18px}

footer{text-align:center;color:var(--mute);font-size:.82rem}
footer a{color:var(--mute)}
footer nav{display:flex;justify-content:center;gap:16px;margin-top:6px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;
  background:var(--cream);color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:600;font-size:.9rem;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  C.phone && { icon:"phone", title:"Call " + C.person, note:C.phone, href:"tel:" + C.phone.replace(/[^\d+]/g,"") },
  C.songlist && { icon:"music", title:"Browse the song list", note:"Pick your song before the night", href:C.songlist },
  C.tiktok && { icon:"tiktok", title:"TikTok", note:"Best mic drops", href:C.tiktok },
  C.youtube && { icon:"youtube", title:"YouTube", note:"Watch the highlights", href:C.youtube },
  C.mapsUrl && { icon:"pin", title:C.location || "Find us", note:"Open in maps", href:C.mapsUrl }
].filter(Boolean);
if (!links.length) links.push({ main:true, icon:"mail", title:"Add your links in CONFIG", note:"Edit the block at the bottom of index.html", href:"#" });
$("#links").innerHTML = links.map(l => {
  const ext = /^https?:/.test(l.href);
  return `<li><a class="ticket${l.main ? " main" : ""}${l.community ? " community" : ""}${l.brand ? " " + l.brand : ""}" href="${esc(l.href)}"${ext ? ' target="_blank" rel="noopener"' : ""}>
    ${svg(l.icon)}<span class="t"><b>${esc(l.title)}</b><small>${esc(l.note)}</small></span></a></li>`;
}).join("");


/* Dates (past ones hidden) */
const today = new Date(); today.setHours(0,0,0,0);
const upcoming = C.dates.filter(d => new Date(d.date + "T00:00") >= today);
if (upcoming.length) {
  $("#dates").innerHTML = upcoming.map(d => {
    const dt = new Date(d.date + "T00:00");
    const mon = dt.toLocaleDateString(undefined, { month:"short" });
    const wd = dt.toLocaleDateString(undefined, { weekday:"long" });
    return `<li class="date"><div class="cal"><span>${esc(mon)}</span><strong>${dt.getDate()}</strong></div>
      <div><b>${esc(d.title)}</b><small>${esc(wd)}${d.time ? ", " + esc(d.time) : ""}${d.place ? " · " + esc(d.place) : ""}</small></div></li>`;
  }).join("");
} else $("#datesSec").hidden = true;

/* Legal footer */
$("#legal").innerHTML = [
  C.impressum && `<a href="${esc(C.impressum)}">Impressum</a>`,
  C.privacy && `<a href="${esc(C.privacy)}">Privacy</a>`
].filter(Boolean).join("");

/* Toast */
let tt;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2200); }

/* Save contact (vCard built on the phone – nothing is sent anywhere) */
function vEsc(s){ return String(s).replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/([,;])/g,"\\$1"); }
function fold(line){ // vCard lines max 75 chars, continuation lines start with a space
  const out=[]; while(line.length>75){ out.push(line.slice(0,75)); line=" "+line.slice(75); } out.push(line); return out.join("\r\n");
}
$("#saveContact").addEventListener("click", () => {
  const v = C.vcard, full = [v.firstName, v.lastName].filter(Boolean).join(" ");
  const icon = document.querySelector('link[rel="icon"]').getAttribute("href");
  const photo = icon.startsWith("data:image/png;base64,") ? icon.split(",")[1] : "";
  const pageUrl = v.url || "";
  const lines = [
    "BEGIN:VCARD","VERSION:3.0",
    `N:${vEsc(v.lastName)};${vEsc(v.firstName)};;;`,
    `FN:${vEsc(full ? full + " – " + v.org : v.org)}`,
    `ORG:${vEsc(v.org)}`,
    v.title && `TITLE:${vEsc(v.title)}`,
    v.phone && `TEL;TYPE=CELL,VOICE:${v.phone}`,
    C.email && `EMAIL;TYPE=INTERNET:${C.email}`,
    (v.city || v.country) && `ADR;TYPE=WORK:;;;${vEsc(v.city)};;;${vEsc(v.country)}`,
    /^https?:/.test(pageUrl) && `URL:${pageUrl}`,
    C.instagram && `X-SOCIALPROFILE;TYPE=instagram:${C.instagram}`,
    C.facebook && `X-SOCIALPROFILE;TYPE=facebook:${C.facebook}`,
    v.note && `NOTE:${vEsc(v.note)}`,
    photo && `PHOTO;ENCODING=b;TYPE=PNG:${photo}`,
    "END:VCARD"
  ].filter(Boolean).map(fold).join("\r\n") + "\r\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([v ? lines : ""], { type:"text/vcard;charset=utf-8" }));
  a.download = "Vivis-Mic-Drop.vcf"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  toast("Contact card downloaded");
});

/* Share */
$("#sharePage").addEventListener("click", async () => {
  const data = { title:C.name, text:C.tagline, url:location.href.split("#")[0] };
  try {
    if (navigator.share) { await navigator.share(data); return; }
    await navigator.clipboard.writeText(data.url); toast("Link copied");
  } catch(e) { if (e.name !== "AbortError") toast("Copy the link from the address bar"); }
});

/* Marquee bulbs around the frame, chasing */
(function bulbs(){
  const box = $("#marquee"); const n = 36; const els = [];
  for (let i = 0; i < n; i++) {
    const p = i / n; let x, y; // walk the perimeter: top, right, bottom, left
    if (p < .25)      { x = 6 + (p/.25)*88;        y = 3; }
    else if (p < .5)  { x = 97;                     y = 6 + ((p-.25)/.25)*88; }
    else if (p < .75) { x = 94 - ((p-.5)/.25)*88;  y = 97; }
    else              { x = 3;                      y = 94 - ((p-.75)/.25)*88; }
    const b = document.createElement("i"); b.className = "bulb on";
    b.style.left = x + "%"; b.style.top = y + "%"; box.appendChild(b); els.push(b);
  }
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let k = 0;
  setInterval(() => { k = (k + 1) % 3; els.forEach((b, i) => b.classList.toggle("on", i % 3 !== k)); }, 260);
})();
</script>
